<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giriş Yap - Dynamic Form Builder</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/frontend/assets/css/style.css" />
  </head>
  <body>
    <div class="container-fluid vh-100 d-flex justify-content-center align-items-center">
      <div class="card shadow-sm p-4" style="max-width: 400px; width: 100%;">
        <div class="card-body">
          <h4 class="text-center mb-4">Giriş Yap</h4>

          <form id="login-form" novalidate>
            <div id="login-error" class="alert alert-danger d-none" role="alert"></div>

            <div class="mb-3">
              <label for="username" class="form-label">Kullanıcı Adı</label>
              <input
                type="text"
                class="form-control"
                id="username"
                name="username"
                autocomplete="username"
                required
              />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Şifre</label>
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                autocomplete="current-password"
                required
              />
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-2" id="sign-in-button">
              <span class="spinner-border spinner-border-sm d-none" id="sign-in-spinner" role="status" aria-hidden="true"></span>
              <span id="sign-in-text">Giriş Yap</span>
            </button>
            <a class="btn btn-outline-secondary w-100" href="/frontend/pages/register.html" id="sign-up-button">
                Kayıt Ol
            </a>
          </form>
        </div>
      </div>
    </div>

    <script type="module" src="/frontend/js/pages/login.js"></script>
  </body>
</html>
