<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Dinamik Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/frontend/assets/css/style.css">
</head>
<body>
    <div id="sidebar-placeholder"></div>
    <div class="main-wrapper">
        <div id="header-placeholder"></div>
        <div class="content-area">
            <div class="container-fluid mt-4">
                <div class="card shadow-sm border-0 bg-white rounded-3">
                    <div class="card-body text-center p-5">
                        <h2 class="fw-bold text-dark mb-3">Sisteme Hoş Geldiniz!</h2>
                        <p class="text-muted fs-5 mb-4">
                            Sol menüyü kullanarak form işlemlerine ve yönetim ayarlarına hızlıca erişebilirsiniz.
                        </p>
                        <div class="alert alert-light d-inline-block border text-secondary" role="alert">
                            <i class="bi bi-info-circle me-2"></i>
                            <strong>Not:</strong> Raporlama ve istatistik modülleri eklendiğinde bu ekran güncellenecektir.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/shared/layout.js"></script>
</body>
</html>
