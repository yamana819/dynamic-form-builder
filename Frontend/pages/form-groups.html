<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Grupları - Dinamik Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/frontend/assets/css/style.css" />
  </head>
  <body>
    <div id="sidebar-placeholder"></div>
    <div class="main-wrapper">
      <div id="header-placeholder"></div>
      <div class="content-area">
        <div class="container-fluid mt-4">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-dark mb-0">Form Grupları Yönetimi</h2>
            <button id="btn-add-group" class="btn btn-primary d-none shadow-sm">
              <i class="bi bi-plus-lg me-1"></i> Yeni Grup Ekle
            </button>
          </div>
          <div class="card shadow-sm border-0 bg-white rounded-3">
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead class="table-light">
                    <tr>
                      <th class="ps-4">Grup Adı</th>
                      <th>Grup Kodu</th>
                      <th class="text-end pe-4">İşlemler</th>
                    </tr>
                  </thead>
                  <tbody id="form-groups-tbody">
                    <tr>
                      <td colspan="3" class="text-center py-5 text-muted">
                        <div class="spinner-border spinner-border-sm text-primary me-2"></div>
                        Veriler yükleniyor...
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Grup Ekle/Düzenle Modalı -->
    <div class="modal fade" id="addGroupModal" tabindex="-1" aria-labelledby="addGroupModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <div class="modal-header bg-light border-bottom-0">
            <h5 class="modal-title fw-bold" id="addGroupModalLabel">Yeni Form Grubu Ekle</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
          </div>
          <div class="modal-body p-4">
            <div id="add-group-error" class="alert alert-danger d-none text-sm py-2" role="alert"></div>
            <form id="add-group-form">
              <div class="mb-3">
                <label for="groupName" class="form-label fw-medium">Grup Adı <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="groupName" placeholder="Örn: İnsan Kaynakları" required minlength="6" maxlength="150" />
                <div class="form-text text-muted" style="font-size: 0.8em">En az 6 karakter. Türkçe karakter kullanılabilir.</div>
              </div>
              <div class="mb-3">
                <label for="groupCode" class="form-label fw-medium">Grup Kodu <span class="text-danger">*</span></label>
                <input type="text" class="form-control font-monospace" id="groupCode" placeholder="Örn: INSAN_KAYNAKLARI" required minlength="2" maxlength="50" />
                <div class="form-text text-muted" style="font-size: 0.8em">Sadece BÜYÜK HARF, rakam, tire (-) veya alt çizgi (_).</div>
              </div>
            </form>
          </div>
          <div class="modal-footer border-top-0 pt-0">
            <button type="button" class="btn btn-secondary text-white" data-bs-dismiss="modal">İptal</button>
            <button type="button" class="btn btn-primary" id="btn-save-group"><i class="bi bi-check-lg me-1"></i> Kaydet</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="formsModal" tabindex="-1" aria-labelledby="formsModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content border-0 shadow-lg">
          <div class="modal-header bg-light border-0">
            <h5 class="modal-title fw-bold" id="formsModalLabel">Formlar</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
          </div>
          <div class="modal-body p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
              <h6 class="mb-0 text-muted" id="formsModalGroupCode"></h6>
              <button class="btn btn-primary shadow-sm" id="btn-add-form">
                <i class="bi bi-plus-lg me-1"></i> Yeni Form Tasarla
              </button>
            </div>

            <div class="table-responsive bg-white rounded shadow-sm border">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th class="ps-4">Form Adı</th>
                    <th>Durum</th>
                    <th>Oluşturulma</th>
                    <th class="text-end pe-4">İşlemler</th>
                  </tr>
                </thead>
                <tbody id="forms-tbody">
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/shared/layout.js"></script>
    <script type="module" src="/frontend/js/pages/form-groups.js"></script>
  </body>
</html>
