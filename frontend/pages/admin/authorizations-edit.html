<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yetki Düzenleme - Dynamic Form Builder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/frontend/assets/css/style.css?v=3" />
    <style>
      .table-auth th, .table-auth td {
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div id="sidebar-placeholder"></div>
    
    <div class="main-wrapper">
      <div id="header-placeholder"></div>
      
      <div class="content-area">
        <div class="container-fluid">
          
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="d-flex align-items-center gap-3">
              <a href="/frontend/pages/admin/authorizations.html" class="btn btn-outline-secondary rounded-circle" style="width: 40px; height: 40px; padding: 0; line-height: 38px; text-align: center;">
                <i class="bi bi-arrow-left"></i>
              </a>
              <div>
                <h4 class="mb-0 fw-bold">Yetki Yapılandırması</h4>
                <p class="text-muted small mb-0">Düzenlenen Rol: <span id="auth-role-name" class="fw-bold text-primary"><span class="spinner-border spinner-border-sm text-primary"></span></span></p>
              </div>
            </div>
            
            <button type="button" class="btn btn-sm btn-outline-danger px-3 rounded-pill shadow-sm" id="btn-uncheck-all-global">
               <i class="bi bi-x-circle me-1"></i> Tüm Yetkileri Temizle
            </button>
          </div>

          <form id="auth-form">
            <div class="card shadow-sm border-0 rounded-4 overflow-hidden mb-4">
              <div class="table-responsive" style="max-height: 65vh; overflow-y: auto;">
                <table class="table table-hover align-middle mb-0" style="min-width: 800px;">
                  <thead class="table-light sticky-top" style="z-index: 1;">
                    <tr>
                      <th class="ps-4 py-3" style="width: 30%">Menü Adı</th>
                      <th class="text-center py-3" style="width: 12%">Görüntüleme</th>
                      <th class="text-center py-3" style="width: 12%">Ekleme</th>
                      <th class="text-center py-3" style="width: 12%">Düzenleme</th>
                      <th class="text-center py-3" style="width: 12%">Silme</th>
                      <th class="text-center py-3 pe-4" style="width: 22%">Hızlı İşlem</th>
                    </tr>
                  </thead>
                  <tbody id="auth-tbody">
                    <tr>
                      <td colspan="6" class="text-center py-5">
                        <div class="spinner-border text-primary"></div>
                        <div class="mt-2 text-muted">Yetkiler Getiriliyor...</div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>

            <div class="d-flex justify-content-end gap-2">
              <a href="/frontend/pages/admin/authorizations.html" class="btn btn-light px-4 rounded-pill">Vazgeç</a>
              <button type="submit" class="btn btn-primary px-4 rounded-pill shadow-sm" id="btn-save-auth">
                <i class="bi bi-save me-1"></i> Değişiklikleri Kaydet
              </button>
            </div>
          </form>

        </div>
      </div>
    </div>

    <!-- Hata ve Başarı Mesajları için Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="/frontend/js/shared/layout.js"></script>
    <script type="module" src="/frontend/js/pages/admin/authorizations-edit.js"></script>
  </body>
</html>
