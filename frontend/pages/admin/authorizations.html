<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yetki Kontrolü Ekranı - Dynamic Form Builder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/frontend/assets/css/style.css?v=3" />
    <style>
      .table-auth th, .table-auth td {
        vertical-align: middle;
        text-align: center;
      }
      .table-auth td:first-child {
        text-align: left;
        font-weight: 500;
      }
      .btn-row-action {
        font-size: 0.8rem;
        padding: 0.2rem 0.5rem;
      }
    </style>
  </head>
  <body>
    <div id="sidebar-placeholder"></div>
    
    <div class="main-wrapper">
      <div id="header-placeholder"></div>
      
      <div class="content-area">
        <div class="container-fluid">
          
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="mb-0">Rol ve Yetki Yönetimi</h4>
            <button class="btn btn-primary shadow-sm" id="btn-add-role">
              <i class="bi bi-plus-lg"></i> Yeni Rol Ekle
            </button>
          </div>

          <!-- Roller Tablosu -->
          <div class="card shadow-sm">
            <div class="card-body">
              <div class="table-responsive">
                <table class="table table-hover align-middle" id="roles-table">
                  <thead class="table-light">
                    <tr>
                      <th># ID</th>
                      <th>Rol Adı</th>
                      <th class="text-end">İşlemler</th>
                    </tr>
                  </thead>
                  <tbody id="roles-tbody">
                    <tr>
                      <td colspan="3" class="text-center text-muted py-4">
                        <div class="spinner-border spinner-border-sm"></div> Roller yükleniyor...
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- Hata ve Başarı Mesajları için Toast Container (Global) -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="/frontend/js/shared/layout.js"></script>
    <script type="module" src="/frontend/js/pages/admin/authorizations.js"></script>
  </body>
</html>
