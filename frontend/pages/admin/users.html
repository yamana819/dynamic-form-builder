<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kullanıcı Yönetimi - Dynamic Form Builder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/frontend/assets/css/style.css?v=3" />
  </head>
  <body>
    <div id="sidebar-placeholder"></div>
    
    <div class="main-wrapper">
      <div id="header-placeholder"></div>
      
      <div class="content-area">
        <div class="container-fluid">
          
          <div class="d-flex justify-content-between align-items-center mb-4">
              <h4 class="mb-0">Kullanıcı Yönetimi</h4>
          </div>

          <div class="card shadow-sm">
              <div class="card-body">
                  <div class="table-responsive">
                      <table class="table table-hover align-middle">
                          <thead class="table-light">
                              <tr>
                                  <th style="width: 15%">Kullanıcı Adı</th>
                                  <th style="width: 15%">Rol</th>
                                  <th style="width: 20%">Kayıt Tarihi</th>
                                  <th style="width: 20%">Son Görülme</th>
                                  <th style="width: 15%">Durum</th>
                                  <th style="width: 15%" class="text-end">İşlemler</th>
                              </tr>
                          </thead>
                          <tbody id="users-tbody">
                              <tr>
                                  <td colspan="6" class="text-center py-4 text-muted">
                                      <div class="spinner-border spinner-border-sm"></div> Kullanıcılar yükleniyor...
                                  </td>
                              </tr>
                          </tbody>
                      </table>
                  </div>
              </div>
          </div>

        </div>
      </div>
    </div>

    <!-- Hata ve Başarı Mesajları için Toast Container (Global) -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="/frontend/js/shared/layout.js"></script>
    <script type="module" src="/frontend/js/pages/admin/users.js"></script>
  </body>
</html>
