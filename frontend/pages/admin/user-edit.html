<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kullanıcı Düzenle - Dynamic Form Builder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/frontend/assets/css/style.css?v=3" />
  </head>
  <body>
    <div id="sidebar-placeholder"></div>
    
    <div class="main-wrapper">
      <div id="header-placeholder"></div>
      
      <div class="content-area">
        <div class="container-fluid">
          
          <div class="d-flex justify-content-between align-items-center mb-4">
              <h4 class="mb-0">Kullanıcı Düzenle</h4>
              <a href="/frontend/pages/admin/users.html" class="btn btn-outline-secondary btn-sm shadow-sm">
                  <i class="bi bi-arrow-left"></i> Geri Dön
              </a>
          </div>

          <div class="row justify-content-center">
              <div class="col-md-8 col-lg-6">
                  <div class="card shadow-sm">
                      <div class="card-body">
                          <form id="form-user-edit">
                              <div class="mb-3">
                                  <label for="userName" class="form-label fw-bold">Kullanıcı Adı</label>
                                  <input type="text" class="form-control" id="userName" name="userName" required minlength="4" maxlength="150" pattern="^[a-zA-Z0-9\.\-_]+$" title="Sadece harf, rakam veya (.,-,_) içerebilir.">
                                  <div class="form-text">Kullanıcı adı boşluk içeremez. En az 4 karakter olmalıdır.</div>
                              </div>
                              
                              <div class="mb-3">
                                  <label for="roleId" class="form-label fw-bold">Rol Ataması</label>
                                  <select class="form-select" id="roleId" name="roleId" required>
                                      <option value="">Yükleniyor...</option>
                                  </select>
                              </div>

                              <div class="mb-4">
                                  <label for="password" class="form-label fw-bold">Şifre Değiştir (Opsiyonel)</label>
                                  <input type="password" class="form-control" id="password" name="password" minlength="8" maxlength="255" pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$" title="En az 8 karakter, 1 büyük harf, 1 küçük harf ve 1 rakam içermelidir." autocomplete="new-password">
                                  <div class="form-text text-muted">En az bir büyük harf, bir küçük harf, bir rakam ve toplam 8 karakter içermelidir.</div>
                              </div>

                              <div class="mb-4 form-check form-switch">
                                  <input class="form-check-input" type="checkbox" id="isActive" checked>
                                  <label class="form-check-label fw-bold" for="isActive">Kullanıcı Aktif mi?</label>
                                  <div class="form-text text-muted">Kullanıcının sisteme girişini engellemek için pasife alabilirsiniz.</div>
                              </div>

                              <hr>
                              <div class="text-end">
                                  <button type="submit" class="btn btn-primary" id="btn-save">
                                      <i class="bi bi-save"></i> Değişiklikleri Kaydet
                                  </button>
                              </div>
                          </form>
                      </div>
                  </div>
              </div>
          </div>

        </div>
      </div>
    </div>

    <!-- Hata ve Başarı Mesajları için Toast Container (Global) -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="/frontend/js/shared/layout.js"></script>
    <script type="module" src="/frontend/js/pages/admin/user-edit.js"></script>
  </body>
</html>
