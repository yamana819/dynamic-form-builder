<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profilim - Dynamic Form Builder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/frontend/assets/css/style.css?v=3" />
  </head>
  <body>
    <div id="sidebar-placeholder"></div>
    
    <div class="main-wrapper">
      <div id="header-placeholder"></div>
      
      <div class="content-area">
        <div class="container-fluid">
          
          <div class="d-flex justify-content-between align-items-center mb-4">
              <h4 class="mb-0">Profilim</h4>
          </div>

          <div class="row justify-content-center">
              <div class="col-md-8 col-lg-6">
                  <div class="card shadow-sm border-0">
                      <div class="card-header bg-white border-bottom-0 pt-4 pb-0 text-center">
                          <div class="bg-primary text-white rounded-circle d-inline-flex justify-content-center align-items-center mb-3 shadow-sm" style="width: 80px; height: 80px; font-size: 2rem;">
                              <i class="bi bi-person-fill"></i>
                          </div>
                          <h5 class="fw-bold mb-0" id="display-username">Yükleniyor...</h5>
                          <p class="text-muted small mt-1" id="display-role">Yükleniyor...</p>
                      </div>
                      <div class="card-body px-4 pb-4">
                          <form id="form-profile-edit">
                              <div class="mb-4">
                                  <label for="userName" class="form-label fw-bold text-secondary small text-uppercase">Kullanıcı Adı</label>
                                  <input type="text" class="form-control bg-light" id="userName" name="userName" required minlength="4" maxlength="150" pattern="^[a-zA-Z0-9\.\-_]+$" title="Sadece harf, rakam veya (.,-,_) içerebilir." disabled>
                                  <div class="form-text d-none" id="username-help">Kullanıcı adı boşluk içeremez. En az 4 karakter olmalıdır.</div>
                              </div>

                              <div class="mb-4">
                                  <label class="form-label fw-bold text-secondary small text-uppercase">Mevcut Rol</label>
                                  <input type="text" class="form-control bg-light" id="roleName" disabled>
                                  <div class="form-text text-muted">Rolünüzün yanlış olduğunu düşünüyorsanız lütfen sistem yöneticinizle iletişime geçin.</div>
                              </div>
                              
                              <hr class="text-muted">
                              <div class="d-flex justify-content-between align-items-center mt-4">
                                  <button type="button" class="btn btn-warning shadow-sm" id="btn-change-password">
                                      <i class="bi bi-key"></i> Şifre Değiştir
                                  </button>

                                  <button type="button" class="btn btn-outline-primary shadow-sm" id="btn-edit-profile">
                                      <i class="bi bi-pencil"></i> Profili Düzenle
                                  </button>
                                  
                                  <button type="submit" class="btn btn-primary shadow-sm d-none" id="btn-save-profile">
                                      <i class="bi bi-save"></i> Kaydet
                                  </button>
                              </div>
                          </form>
                      </div>
                  </div>
              </div>
          </div>

        </div>
      </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="/frontend/js/shared/layout.js"></script>
    <script type="module" src="/frontend/js/pages/profile.js"></script>
  </body>
</html>
