<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kayıt Detayı - Dinamik Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/frontend/assets/css/style.css" />
    <link rel="stylesheet" href="https://cdn.form.io/formiojs/4.19.1/formio.full.min.css" />
  </head>
  <body>
    <div id="sidebar-placeholder"></div>
    <div class="main-wrapper">
      <div id="header-placeholder"></div>
      <div class="content-area">
        <div class="container-fluid mt-4" style="max-width: 900px;">
          
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
              <button class="btn btn-sm btn-outline-secondary mb-2" id="btn-back">
                <i class="bi bi-arrow-left"></i> Listeye Dön
              </button>
              <h2 class="fw-bold text-dark mb-1" id="page-title">Kayıt Detayı</h2>
              <p class="text-muted mb-0" id="page-subtitle">Yükleniyor...</p>
            </div>
            <div>
              <button class="btn btn-outline-danger d-none me-2" id="btn-delete-record">
                <i class="bi bi-trash"></i> Sil
              </button>
              <button class="btn btn-primary px-4 shadow-sm" id="btn-save-record">
                <i class="bi bi-check-lg me-1"></i> Kaydet
              </button>
            </div>
          </div>
          
          <div id="record-error" class="alert alert-danger d-none shadow-sm" role="alert"></div>
          
          <div class="card shadow-sm border-0 bg-white rounded-4 position-relative" style="min-height: 400px;">
            <!-- Yükleniyor Overlay'i -->
            <div id="page-loader" class="position-absolute w-100 h-100 d-flex flex-column align-items-center justify-content-center bg-white rounded-4" style="z-index: 10; top: 0; left: 0;">
                <div class="spinner-border text-primary mb-3" role="status" style="width: 3rem; height: 3rem;"></div>
                <h5 class="text-muted fw-semibold" id="loader-text">Form Şeması Yükleniyor...</h5>
            </div>
            
            <div class="card-body p-4 p-lg-5" style="opacity: 0; transition: opacity 0.3s;" id="form-content-area">
              <form id="record-form">
                <div class="row" id="dynamic-form-container">
                </div>
              </form>
            </div>
          </div>
          
        </div>
      </div>
    </div>

    <!-- Silme Onay Modalı -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content border-0 shadow">
          <div class="modal-body p-4 text-center">
            <i class="bi bi-exclamation-circle text-danger" style="font-size: 3rem;"></i>
            <h5 class="mt-3 fw-bold">Emin misiniz?</h5>
            <p class="text-muted mb-4">Bu kayıt kalıcı olarak silinecektir.</p>
            <div class="d-flex justify-content-center gap-2">
              <button type="button" class="btn btn-light" data-bs-dismiss="modal">İptal</button>
              <button type="button" class="btn btn-danger" id="btn-confirm-delete">Evet, Sil</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/shared/layout.js"></script>
    <script type="module" src="/frontend/js/pages/forms/record-edit.js"></script>
    <script src="https://cdn.form.io/formiojs/4.19.1/formio.full.min.js"></script>
  </body>
</html>
